name: CI/CD to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Vote
        run: |
          cd vote
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vote:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/vote:latest

      - name: Build and Push Result
        run: |
          cd result
          docker build -t ${{ secrets.DOCKER_USERNAME }}/result:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/result:latest

      - name: Build and Push Worker
        run: |
          cd worker
          docker build -t ${{ secrets.DOCKER_USERNAME }}/worker:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/worker:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name YOUR-CLUSTER-NAME --region us-east-1

      - name: Deploy to EKS
        run: kubectl apply -f k8s/
